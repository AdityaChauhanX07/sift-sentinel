[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sift-sentinel"
version = "0.1.0"
description = "A grounded forensic reasoning engine for Protocol SIFT — deterministic hallucination catching for autonomous incident response."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "SIFT Sentinel Contributors" },
]
dependencies = []

[project.scripts]
sift-sentinel = "sift_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
